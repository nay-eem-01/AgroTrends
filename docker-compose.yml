# Local source build. Host Nginx handles HTTPS; PostgreSQL is hosted on Supabase.
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      STORAGE_DIR: /data/uploads
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - uploads:/data/uploads
    mem_limit: 1g
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }
volumes:
  uploads:
