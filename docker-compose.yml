# One server: the app and Caddy for HTTPS. The database is Supabase (PostgreSQL with pgvector), set by DB_URL,
# DB_USERNAME and DB_PASSWORD in .env next to this file.
#   docker compose up -d --build
# Only Caddy publishes ports; the app is reachable inside this network only.
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      STORAGE_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    mem_limit: 1g
    logging:
      driver: json-file
      options: { max-size: 20m, max-file: "5" }

  caddy:
    image: caddy:2.10
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in .env, e.g. api.example.com}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  uploads:
  caddy-data:
  caddy-config:
