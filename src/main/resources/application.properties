spring.application.name=AgriculturalBlogApplication

# Local secrets live in an untracked ".env" file next to the jar / project root (KEY=value lines).
# See .env.example for the full list. Real environment variables work too and take precedence.
spring.config.import=optional:file:.env[.properties]

# Server Configuration
server.port=8080

# Application config
app.name = @project.name@
app.backendUrl = http://localhost:${server.port}
app.backendUrlShort = localhost:${server.port}
app.frontendUrl=${FRONTEND_URL:http://localhost:5173}

# Security (no defaults on purpose: the app refuses to start without them)
# JWT_SECRET must be at least 32 characters, e.g.  openssl rand -base64 48
app.jwt.secret=${JWT_SECRET}
# Optional. If unset, a random super-admin password is generated and logged once at WARN level.
app.admin.initial-password=${INITIAL_ADMIN_PASSWORD:}
app.admin.initial-email=${INITIAL_ADMIN_EMAIL:admin@agrotrends.local}

# Spring AI configuration
spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.options.model = gemini-2.5-flash

# Add embedding model
spring.ai.google.genai.embedding.text.options.model = text-embedding-004

# Vector store config
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.dimensions=768
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.table-name=vector_store

# psql Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/agrotrends}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.default_schema=public


# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto = update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Mail (password reset). Leave spring.mail.host unset in dev: reset links are then logged instead of sent.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:no-reply@agrotrends.local}

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8


# Logging Configuration
logging.level.root=INFO
logging.file.path=@project.artifactId@
logging.level.org.hibernate = ERROR
logging.level.org.springframework.ws = INFO
logging.level.org.springframework.web = INFO
logging.level.org.springframework.security=INFO

# Swagger config
springdoc.swagger-ui.operationsSorter = method
springdoc.swagger-ui.tags-sorter = alpha
springdoc.swagger-ui.path = /swagger-ui.html
springdoc.swagger-ui.docExpansion = none
