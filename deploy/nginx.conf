# Reference for /etc/nginx/sites-available/agrotrends. Back up and test before applying.
# Certificates must already exist; retain your actual Certbot certificate lineage.
server {
    listen 80;
    server_name api.agrotrends.ahmednayeem.tech app.agrotrends.ahmednayeem.tech;
    return 301 https://$host$request_uri;
}
server {
    server_name api.agrotrends.ahmednayeem.tech;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/api.agrotrends.ahmednayeem.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.agrotrends.ahmednayeem.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    client_max_body_size 20m;
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
server {
    server_name app.agrotrends.ahmednayeem.tech;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/api.agrotrends.ahmednayeem.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.agrotrends.ahmednayeem.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    root /var/www/agrotrends-current;
    index index.html;
    location = /deployment-version.txt {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }
    location /assets/ {
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
