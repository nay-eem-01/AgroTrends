# CI-built image. Host Nginx proxies to loopback; secrets stay in backend/.env on the VM.
services:
  app:
    image: ${APP_IMAGE:?Supply an immutable image digest}
    restart: unless-stopped
    env_file: ${APP_ENV_FILE:?Supply the absolute backend .env path}
    environment:
      SPRING_PROFILES_ACTIVE: prod
      STORAGE_DIR: /data/uploads
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - uploads:/data/uploads
    mem_limit: 1g
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }
volumes:
  uploads:
