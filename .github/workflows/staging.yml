name: Staging deployment
on:
  pull_request:
    branches: [development, staging]
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Unit tests (DB integration test remains deferred)
        run: bash ./mvnw -B test -Duser.timezone=Asia/Dhaka -Dtest='!AgriculturalBlogApplicationTests'
      - name: Deployment script regression checks
        run: python3 deploy/test_deploy.py

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/staging'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: staging
    concurrency:
      group: staging-backend
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build and publish immutable image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build --tag "$image" .
          docker push "$image"
          digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$image")
          [[ "$digest" =~ ^ghcr.io/[a-z0-9._/-]+@sha256:[a-f0-9]{64}$ ]]
          printf '%s\n' "$digest" > deploy/image
          tar -czf release.tar.gz -C deploy deploy.sh compose.image.yml image
      - name: Upload and deploy over verified SSH
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?Set staging DEPLOY_HOST}" "${DEPLOY_USER:?Set staging DEPLOY_USER}"
          : "${DEPLOY_SSH_KEY:?Set staging DEPLOY_SSH_KEY}" "${DEPLOY_KNOWN_HOSTS:?Set staging DEPLOY_KNOWN_HOSTS}"
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9.-]+$ && "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh-keygen -F "$DEPLOY_HOST" -f ~/.ssh/known_hosts > /dev/null
          options=(-i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20)
          release="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          target="$DEPLOY_USER@$DEPLOY_HOST"
          ssh "${options[@]}" "$target" "mkdir -p agrotrends/backend-releases/$release"
          scp "${options[@]}" release.tar.gz "$target:agrotrends/backend-releases/$release/release.tar.gz"
          ssh "${options[@]}" "$target" "cd agrotrends/backend-releases/$release && tar -xzf release.tar.gz && bash deploy.sh \$(cat image)"
      - name: Verify public API
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 https://api.agrotrends.ahmednayeem.tech/actuator/health | python3 -c 'import json,sys; sys.exit(json.load(sys.stdin).get("status") != "UP")'
